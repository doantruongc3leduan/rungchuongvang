<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kết quả - Rung Chuông Vàng</title><link rel="stylesheet" href="style.css"></head><body><main class="screen active"><section class="question-card glass"><h1>🏆 BẢNG XẾP HẠNG</h1><div id="results">Đang tải kết quả...</div></section></main><script src="config.js"></script><script>function api(action){return new Promise((resolve,reject)=>{let cb='res_'+Date.now(),u=new URL(RCV_CONFIG.API_URL);u.searchParams.set('action',action);u.searchParams.set('callback',cb);let s=document.createElement('script');s.src=u;let tm=setTimeout(()=>{delete window[cb];s.remove();reject(Error('timeout'))},10000);window[cb]=d=>{clearTimeout(tm);delete window[cb];s.remove();resolve(d)};s.onerror=reject;document.body.appendChild(s)})}async function load(){try{let d=await api("leaderboard");if(!d.ok)throw Error(d.message);document.querySelector("#results").innerHTML="<table style='width:100%;border-collapse:collapse;text-align:left'><tr><th>Hạng</th><th>Họ tên</th><th>Lớp</th><th>Câu đúng</th><th>Trạng thái</th></tr>"+d.rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.hoTen)}</td><td>${esc(x.lop)}</td><td>${x.correct}</td><td>${esc(x.status)}</td></tr>`).join("")+"</table>"}catch(e){document.querySelector('#results').textContent=e.message}}function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}load();</script></body></html>
