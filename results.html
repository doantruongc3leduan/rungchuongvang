<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bảng Xếp Hạng Pro - Rung Chuông Vàng</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <main class="screen active">
    <section class="question-card glass" style="width:min(1000px,100%)">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px">
        <div style="text-align:left">
          <div class="eyebrow">VINH DANH TRI THỨC</div>
          <h1 style="margin:6px 0 0;font-size:clamp(26px,4vw,42px);color:#143d70">🏆 BẢNG XẾP HẠNG CHUNG CUỘC</h1>
        </div>
        <div style="display:flex;gap:8px">
          <button id="btnExportRes" class="action-btn outline-btn">📥 XUẤT BẢNG ĐIỂM</button>
          <a href="index.html" class="action-btn soft-btn" style="text-decoration:none">← TRANG CHỦ</a>
        </div>
      </div>
      <div id="podium" class="podium-grid"></div>
      <div id="results" class="table-wrap" style="margin-top:18px">Đang tải kết quả...</div>
    </section>
  </main>
  <script src="config.js"></script>
  <script>
    let currentRows = [];
    function api(action) {
      return new Promise((resolve, reject) => {
        const cb = 'res_' + Date.now();
        const u = new URL(RCV_CONFIG.API_URL);
        u.searchParams.set('action', action);
        u.searchParams.set('callback', cb);
        const s = document.createElement('script');
        s.src = u.toString();
        const tm = setTimeout(() => { delete window[cb]; s.remove(); reject(Error('Hết thời gian kết nối')); }, 10000);
        window[cb] = d => { clearTimeout(tm); delete window[cb]; s.remove(); resolve(d); };
        s.onerror = () => { clearTimeout(tm); delete window[cb]; s.remove(); reject(Error('Lỗi kết nối')); };
        document.body.appendChild(s);
      });
    }
    function esc(s) {
      return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }
    async function load() {
      try {
        const d = await api("leaderboard");
        if (!d.ok) throw Error(d.message);
        currentRows = d.rows || [];
        if (!currentRows.length) {
          document.querySelector("#results").innerHTML = "<div class='empty-row'>Chưa có dữ liệu kết quả thi.</div>";
          return;
        }
        const top3 = currentRows.slice(0, 3);
        const medals = ['🥇 QUÁN QUÂN', '🥈 Á QUÂN', '🥉 HẠNG BA'];
        document.querySelector("#podium").innerHTML = top3.map((x, idx) => `
          <div class="podium-card rank-${idx + 1}">
            <span class="medal">${medals[idx]}</span>
            <h3>${esc(x.hoTen)}</h3>
            <p>${esc(x.lop)}</p>
            <strong>${x.correct} câu đúng</strong>
          </div>
        `).join('');

        document.querySelector("#results").innerHTML = `
          <table class="roster-table" style="min-width:600px">
            <thead>
              <tr><th>HẠNG</th><th>HỌ VÀ TÊN</th><th>LỚP</th><th>CÂU ĐÚNG</th><th>TRẠNG THÁI</th></tr>
            </thead>
            <tbody>
              ${currentRows.map((x, i) => `
                <tr>
                  <td><b>#${i + 1}</b></td>
                  <td><b>${esc(x.hoTen)}</b></td>
                  <td>${esc(x.lop)}</td>
                  <td><strong style="color:var(--blue);font-size:15px">${x.correct}</strong></td>
                  <td><span class="status-tag ${x.status === 'BỊ LOẠI' ? 'eliminated' : 'active'}">${esc(x.status)}</span></td>
                </tr>
              `).join("")}
            </tbody>
          </table>`;
      } catch (e) {
        document.querySelector('#results').innerHTML = `<div class='empty-row' style='color:var(--red)'>${esc(e.message)}</div>`;
      }
    }
    document.querySelector('#btnExportRes').onclick = () => {
      if (!currentRows.length) return;
      const lines = ['Hang,HoTen,Lop,SoCauDung,TrangThai'];
      currentRows.forEach((r, i) => lines.push([i + 1, r.hoTen, r.lop, r.correct, r.status].map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(',')));
      const blob = new Blob(['﻿' + lines.join('
')], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `BangXepHang_RCV_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
    };
    load();
  </script>
</body>
</html>
