<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Màn hình sân khấu Pro - Rung Chuông Vàng</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="stage-body">
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <main class="screen active" style="padding:20px">
    <section class="question-card glass" style="width:min(1280px,100%);padding:clamp(24px,4vw,48px)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div class="eyebrow">TRƯỜNG THPT LÊ DUẨN · TÂY NINH</div>
        <button id="stageSoundBtn" class="icon-pill" title="Bật/Tắt âm thanh sân khấu">🔇 Bật âm thanh</button>
      </div>
      <h1 style="font-size:clamp(34px,5.5vw,72px);margin:8px 0;color:#143d70">🔔 RUNG CHUÔNG VÀNG</h1>
      
      <div id="stageState" class="question-label" style="font-size:15px;margin:10px 0">CHỜ MC BẮT ĐẦU</div>
      
      <div class="stage-timer-wrap">
        <div id="stageTimer" class="stage-timer">--</div>
      </div>

      <h2 id="stageQuestion" style="font-size:clamp(24px,3.6vw,44px);margin:20px auto 32px">Chào mừng quý thầy cô và các em học sinh</h2>
      
      <div id="stageOptions" class="options stage-options"></div>
      
      <div class="stage-footer">
        <div id="stageStats" class="stage-stats-bar">Đang tải dữ liệu sân khấu...</div>
      </div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="screen.js"></script>
</body>
</html>
