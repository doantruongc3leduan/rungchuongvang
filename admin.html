<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Điều khiển Rung Chuông Vàng</title><link rel="stylesheet" href="style.css"></head><body><header class="site-head"><div class="brand-mark">🎛️</div><div><b>BAN TỔ CHỨC</b><small>ĐIỀU KHIỂN CUỘC THI</small></div></header><main class="screen active"><section class="question-card glass"><h1>TRUNG TÂM ĐIỀU KHIỂN</h1><div class="admin-login"><input id="adminUser" placeholder="Tài khoản quản trị"><input id="adminPass" type="password" placeholder="Mật khẩu quản trị"><button class="btn primary" id="loginAdmin">ĐĂNG NHẬP</button></div><div id="controls" class="hidden"><div class="options"><button id="start">▶ BẮT ĐẦU</button><button id="pause">Ⅱ TẠM DỪNG</button><button id="next">⏭ CÂU TIẾP THEO</button><button id="finish">■ KẾT THÚC</button></div><div class="options settings"><label>Số câu thi<input id="totalQ" type="number" min="1" max="100" value="20"></label><label>Giây mỗi câu<input id="seconds" type="number" min="5" max="120" value="10"></label><label>Số lượng câu thư viện<input id="pool" type="number" min="1" max="100" value="100"></label><button id="saveSettings">LƯU CẤU HÌNH</button></div><div id="stats" class="stats"></div></div><pre id="adminMsg"></pre></section></main><script src="config.js"></script><script src="admin.js"></script></body></html>
